name: Prerelease Snapchain
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA to build from"
        required: true
        type: string
      tag_suffix:
        description: "Custom tag suffix (default: short SHA of resolved ref)"
        required: false
        type: string
        default: ""

concurrency:
  group: snapchain-prerelease-${{ inputs.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write # OIDC
  packages: write

jobs:
  build:
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_WRITE_PASSWORD }}

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Share the registry-backed cache with the main CI build (docker-build-impl.yml)
      # and the deployer. Read the prerelease ref's own branch tag, then fall back to
      # main; write the branch tag so repeat prereleases of the same ref stay warm.
      # See NEYN-11876.
      - name: Compute cache refs
        id: cache
        env:
          ARCH: ${{ matrix.arch }}
          REF_RAW: ${{ inputs.ref }}
        run: |
          repo="ghcr.io/farcasterxyz/snapchain/cache"
          # OCI tags may not contain "/", matching how snapchain CI writes them.
          branch="${REF_RAW//\//-}"
          {
            echo "from<<EOF"
            echo "type=registry,ref=${repo}:${ARCH}-${branch}"
            echo "type=registry,ref=${repo}:${ARCH}-main"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          {
            echo "to<<EOF"
            echo "type=registry,mode=max,ref=${repo}:${ARCH}-${branch}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          file: ./Dockerfile.distroless
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=farcasterxyz/snapchain,push-by-digest=true,name-canonical=true,push=true
          cache-from: ${{ steps.cache.outputs.from }}
          cache-to: ${{ steps.cache.outputs.to }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > /tmp/digests/${{ matrix.arch }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/${{ matrix.arch }}

  create-manifest:
    timeout-minutes: 10
    runs-on: ubuntu-26.04
    needs: build

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Compute prerelease tag
        id: tag
        run: |
          short_sha=$(git rev-parse --short=7 HEAD)
          ref_slug=$(echo "${{ inputs.ref }}" | tr '/' '-' | tr -c 'A-Za-z0-9._-' '-' | sed 's/-\+$//')
          if [ -n "${{ inputs.tag_suffix }}" ]; then
            tag="pre-${ref_slug}-${{ inputs.tag_suffix }}"
          else
            tag="pre-${ref_slug}-${short_sha}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Prerelease tag: ${tag}"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_WRITE_PASSWORD }}

      - name: Create and push multi-arch prerelease manifest
        run: |
          AMD64_DIGEST=$(cat /tmp/digests/amd64)
          ARM64_DIGEST=$(cat /tmp/digests/arm64)
          TAG=${{ steps.tag.outputs.tag }}

          docker buildx imagetools create \
            -t farcasterxyz/snapchain:${TAG} \
            farcasterxyz/snapchain@${AMD64_DIGEST} \
            farcasterxyz/snapchain@${ARM64_DIGEST}

      - name: Summarize
        run: |
          echo "### Prerelease published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: \`farcasterxyz/snapchain:${{ steps.tag.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Pull with:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "docker pull farcasterxyz/snapchain:${{ steps.tag.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
