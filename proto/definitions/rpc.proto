syntax = "proto3";

import "message.proto";
import "blocks.proto";
import "hub_event.proto";
import "username_proof.proto";
import "onchain_event.proto";
import "request_response.proto";

service HubService {
  // Write API
  rpc SubmitMessage(Message) returns (Message);
  rpc SubmitBulkMessages(SubmitBulkMessagesRequest) returns (SubmitBulkMessagesResponse);

  // Validation Methods
  rpc ValidateMessage(Message) returns (ValidationResponse);

  // Block API
  rpc GetBlocks(BlocksRequest) returns (stream Block);
  rpc GetShardChunks(ShardChunksRequest) returns (ShardChunksResponse);

  rpc GetInfo(GetInfoRequest) returns (GetInfoResponse);
  rpc GetFids(FidsRequest) returns (FidsResponse);
  rpc GetConnectedPeers(GetConnectedPeersRequest) returns (GetConnectedPeersResponse);
  // Mesh health & topology: this node's local view of the gossip mesh. Admin-gated.
  rpc GetMeshView(GetMeshViewRequest) returns (MeshView);
  // Network-wide topology: centralized crawl of connected validators over the
  // gossip port, aggregating each validator's local mesh view. Admin-gated.
  rpc GetMeshTopology(GetMeshViewRequest) returns (MeshTopology);

  // Events
  rpc Subscribe(SubscribeRequest) returns (stream HubEvent);
  rpc GetEvent(EventRequest) returns (HubEvent);
  rpc GetEvents(EventsRequest) returns (EventsResponse);


  // Casts
  rpc GetCast(CastId) returns (Message);
  rpc GetCastsByFid(FidRequest) returns (MessagesResponse);
  rpc GetCastsByParent(CastsByParentRequest) returns (MessagesResponse);
  rpc GetCastsByMention(FidRequest) returns (MessagesResponse);

  // Reactions
  rpc GetReaction(ReactionRequest) returns (Message);
  rpc GetReactionsByFid(ReactionsByFidRequest) returns (MessagesResponse);
  rpc GetReactionsByCast(ReactionsByTargetRequest) returns (MessagesResponse); // To be deprecated
  rpc GetReactionsByTarget(ReactionsByTargetRequest) returns (MessagesResponse);

  // User Data
  rpc GetUserData(UserDataRequest) returns (Message);
  rpc GetUserDataByFid(FidRequest) returns (MessagesResponse);

  // Username Proof
  rpc GetUsernameProof(UsernameProofRequest) returns (UserNameProof);
  rpc GetUserNameProofsByFid(FidRequest) returns (UsernameProofsResponse);

  // Verifications
  rpc GetVerification(VerificationRequest) returns (Message);
  rpc GetVerificationsByFid(FidRequest) returns (MessagesResponse);

  // OnChain Events
  // DEPRECATED in favor of GetSigner (unified). Returns on-chain signer events
  // only — gasless / off-chain keys are not surfaced through this RPC.
  rpc GetOnChainSigner(SignerRequest) returns (OnChainEvent);
  // DEPRECATED in favor of GetSignersByFid (unified). Returns on-chain signer
  // events only — gasless / off-chain keys are not surfaced through this RPC.
  rpc GetOnChainSignersByFid(FidRequest) returns (OnChainEventResponse);

  // Unified signer surface — returns both on-chain and off-chain (gasless) keys.
  rpc GetSigner(SignerRequest) returns (SignerResponse);
  rpc GetSignersByFid(SignersByFidRequest) returns (SignersByFidResponse);

  rpc GetOnChainEvents(OnChainEventRequest) returns (OnChainEventResponse);
  // Resolves the current channel registry owner address to an fid using the
  // shard-0 verification replica. The owner is the last-write-wins verifier of
  // the address across all shards. An fid of 0 means the channel is registered
  // but no verified owner is present in shard-0 consensus state ("parked").
  // This read is not consensus.
  //
  // Expiry is returned as-is and may be in the past. The registry contract
  // emits no onchain event when a lapsed registration's grace period ends, so
  // this endpoint reports the last known registration (owner address + expiry)
  // until a later registration supersedes it; it never computes grace or
  // release state. Callers interpret `expiry` themselves (e.g. against the
  // deployed grace period). NOT_FOUND is returned only for a channel key with
  // no registration record at all.
  rpc GetChannelOwner(ChannelOwnerRequest) returns (ChannelOwnerResponse);
  // Lists channels for a raw 20-byte EVM owner address, including lapsed
  // registrations (expiry in the past) until a later registration supersedes
  // them — see GetChannelOwner's expiry note; callers interpret `expiry`
  // themselves. Owner resolution uses the shard-0 verification replica, as in
  // GetChannelOwner.
  // This read is not consensus. `page_token` is opaque bytes; callers page until
  // `next_page_token` is unset, which marks the end of enumeration. A page that
  // lands exactly on the last entry may return a token that yields one final
  // empty page, so a present token means "page again", not "results guaranteed".
  rpc GetChannelsByAddress(ChannelsByAddressRequest) returns (ChannelsResponse);
  // Lists channels that currently resolve to `fid`, including lapsed
  // registrations (see GetChannelOwner's expiry note). The node must host the
  // fid's home shard to enumerate its verified addresses, following existing
  // fid-routed read behavior. The final owner-winner filter uses the shard-0
  // verification replica, as in GetChannelOwner. This read is not consensus.
  //
  // This is a joined read over the fid's verified EVM addresses and the channel
  // owner-address index. The verified addresses are enumerated in ascending
  // order, making the owner-address index key a globally ordered composite
  // cursor across the join. `page_token` is opaque bytes and the paging contract
  // is identical to GetChannelsByAddress: page until `next_page_token` is unset
  // (a boundary-aligned page may return one final empty page). There is no
  // `reverse` (addresses iterate ascending only).
  rpc GetChannelsByFid(ChannelsByFidRequest) returns (ChannelsResponse);
  rpc GetIdRegistryOnChainEvent(FidRequest) returns (OnChainEvent);
  rpc GetIdRegistryOnChainEventByAddress(IdRegistryEventByAddressRequest) returns (OnChainEvent);
  rpc GetCurrentStorageLimitsByFid(FidRequest) returns (StorageLimitsResponse);
  rpc GetFidAddressType(FidAddressTypeRequest) returns (FidAddressTypeResponse);

  // Links
  rpc GetLink(LinkRequest) returns (Message);
  rpc GetLinksByFid(LinksByFidRequest) returns (MessagesResponse);
  rpc GetLinksByTarget(LinksByTargetRequest) returns (MessagesResponse);
  rpc GetLinkCompactStateMessageByFid(FidRequest) returns (MessagesResponse);

  // Bulk Methods
  rpc GetAllCastMessagesByFid(FidTimestampRequest) returns (MessagesResponse);
  rpc GetAllReactionMessagesByFid(FidTimestampRequest) returns (MessagesResponse);
  rpc GetAllVerificationMessagesByFid(FidTimestampRequest) returns (MessagesResponse);
  rpc GetAllUserDataMessagesByFid(FidTimestampRequest) returns (MessagesResponse);
  rpc GetAllLinkMessagesByFid(FidTimestampRequest) returns (MessagesResponse);
  rpc GetAllLendStorageMessagesByFid(FidTimestampRequest) returns (MessagesResponse);

  rpc GetTrieMetadataByPrefix(TrieNodeMetadataRequest) returns (TrieNodeMetadataResponse);
};
